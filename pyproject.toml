[project]
name = "hud-ai-safety-paper-replication-demo"
version = "0.2.0"
description = "HUD v6 RL environment demo for reproducing a redacted AI-safety monitoring study"
requires-python = ">=3.11,<3.13"
dependencies = [
  "hud==0.6.13",
  "httpx[socks]>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[tool.uv]
package = false

[tool.hud]
image = "hud-ai-safety-paper-replication-demo"
